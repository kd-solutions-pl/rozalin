# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rozalin"
BBFILE_PATTERN_meta-rozalin = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rozalin = "9"

LAYERDEPENDS_meta-rozalin = "core"
LAYERSERIES_COMPAT_meta-rozalin = "wrynose"
