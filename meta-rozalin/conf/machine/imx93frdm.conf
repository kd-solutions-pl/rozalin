require include/common.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

MACHINE_FEATURES = "usbhost usbgadget alsa serial"

SERIAL_CONSOLES = "115200;ttyLP0"

PREFERRED_PROVIDER_virtual/kernel = "linux-rozalin"
PREFERRED_PROVIDER_trusted-firmware-a = "trusted-firmware-a"
PREFERRED_PROVIDER_optee-os = "optee-os"
PREFERRED_PROVIDER_optee-os-tadevkit = "optee-os-tadevkit"
PREFERRED_PROVIDER_optee-examples = "optee-examples"
KERNEL_DEVICETREE = "freescale/imx93-11x11-frdm.dtb"
KERNEL_IMAGETYPE = "Image"

COMPATIBLE_MACHINE:pn-optee-examples = "^imx93frdm$"

SECO_FIRMWARE_NAME = "mx93a1-ahab-container.img"

IMX_BOOT_SEEK = "32"

PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-rozalin"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "u-boot-rozalin-extlinux kernel-devicetree"
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "imx93_frdm_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[sd] = "sdcard"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " \
    kernel-module-adp5585 \
    kernel-module-dwmac-imx \
    kernel-module-flexcan \
    kernel-module-imx7ulp-wdt \
    kernel-module-imx93-adc \
    kernel-module-nvmem-imx-ocotp-ele \
    kernel-module-nxp-bbnsm-pwrkey \
    kernel-module-qoriq-thermal \
    kernel-module-reset-gpio \
    kernel-module-rtc-nxp-bbnsm \
    kernel-module-rtc-pcf2127 \
    kernel-module-spidev \
    kernel-module-tcpci \
    kernel-module-nxp-wlan \
    firmware-nxp-wifi-nxpiw612-sdio \
"

IMAGE_BOOT_FILES ?= " \
    ${KERNEL_IMAGETYPE} \
    ${@os.path.basename(d.getVar("KERNEL_DEVICETREE"))} \
"
